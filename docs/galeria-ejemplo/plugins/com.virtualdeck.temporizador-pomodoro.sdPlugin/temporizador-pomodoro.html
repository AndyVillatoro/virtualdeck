<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Temporizador pomodoro</title>
  </head>
  <body>
    <script src="sdk.js"></script>
    <script src="punto.js"></script>
    <script>
      /* Temporizador pomodoro de VirtualDeck: 25 de foco y 5 de pausa.
       *
       * Tecla: pulsacion corta arranca o pausa; pulsacion larga vuelve al
       * inicio del foco. Perilla: girar ajusta los minutos de la fase actual
       * (foco o pausa) y pulsarla hace lo mismo que la tecla. Los minutos de
       * cada fase salen de los ajustes del boton (los cambia el Property
       * Inspector) y al terminar el foco se encadena la pausa sola.
       */
      (function () {
        const botones = new Map();
        const pulsado = new Map();
        const LARGO_MS = 700;

        function minutosDe(valor, defecto) {
          const n = Math.round(Number(valor));
          return Number.isFinite(n) && n > 0 && n <= 180 ? n : defecto;
        }

        function ajustesDe(mensaje) {
          const ajustes = (mensaje.payload && mensaje.payload.settings) || {};
          return {
            foco: minutosDe(ajustes.foco, 25),
            descanso: minutosDe(ajustes.descanso, 5),
            encadenar: ajustes.encadenar === undefined ? true : !!ajustes.encadenar,
          };
        }

        function estadoDe(contexto, ajustes) {
          if (!botones.has(contexto)) {
            const base = ajustes || { foco: 25, descanso: 5, encadenar: true };
            botones.set(contexto, { fase: 'foco', restante: base.foco * 60000, fin: 0, ajustes: base });
          }
          return botones.get(contexto);
        }

        /** Lo que queda: la cifra guardada en pausa, o la cuenta atras si corre. */
        function restante(estado) {
          if (!estado.fin) return estado.restante;
          return Math.max(0, estado.fin - Date.now());
        }

        function cara(milis) {
          const total = Math.ceil(milis / 1000);
          const minutos = Math.floor(total / 60);
          const segundos = total % 60;
          const dos = (n) => (n < 10 ? '0' + n : String(n));
          return dos(minutos) + ':' + dos(segundos);
        }

        function pintar(contexto) {
          const estado = botones.get(contexto);
          if (!estado) return;
          const foco = estado.fase === 'foco';
          const texto = cara(restante(estado));
          StreamDeck.setTitle(contexto, texto);
          StreamDeck.setImage(
            contexto,
            Puntos.datos(
              [
                { t: texto, c: foco ? 'punto' : 'tenue' },
                { t: foco ? 'FOCO' : 'PAUSA', c: foco ? 'acento' : 'tenue' },
              ],
              { led: estado.fin ? 'acento' : 'tenue', marca: foco },
            ),
          );
        }

        function arrancar(contexto) {
          const estado = estadoDe(contexto);
          estado.fin = Date.now() + restante(estado);
          pintar(contexto);
        }

        function pausar(contexto) {
          const estado = estadoDe(contexto);
          estado.restante = restante(estado);
          estado.fin = 0;
          pintar(contexto);
        }

        function cambiarFase(contexto) {
          const estado = estadoDe(contexto);
          const foco = estado.fase === 'foco';
          estado.fase = foco ? 'descanso' : 'foco';
          estado.restante = (foco ? estado.ajustes.descanso : estado.ajustes.foco) * 60000;
          estado.fin = 0;
          pintar(contexto);
        }

        function reiniciar(contexto) {
          const estado = estadoDe(contexto);
          estado.fase = 'foco';
          estado.restante = estado.ajustes.foco * 60000;
          estado.fin = 0;
          pintar(contexto);
        }

        function guardarAjustes(contexto, estado) {
          StreamDeck.setSettings(contexto, {
            foco: estado.ajustes.foco,
            descanso: estado.ajustes.descanso,
            encadenar: estado.ajustes.encadenar,
          });
        }

        /**
         * Suma o resta minutos a la fase actual.
         *
         * Si el temporizador corre, el final se mueve lo mismo; si esta en
         * pausa, la cifra guardada se mueve dentro del nuevo total. Los topes
         * son los del inspector: 180 de foco y 60 de pausa.
         */
        function ajustarMinutos(contexto, delta) {
          const estado = estadoDe(contexto);
          const foco = estado.fase === 'foco';
          const clave = foco ? 'foco' : 'descanso';
          const tope = foco ? 180 : 60;
          const antes = estado.ajustes[clave];
          const despues = Math.max(1, Math.min(tope, antes + delta));
          if (despues === antes) return;
          estado.ajustes[clave] = despues;
          const cambio = (despues - antes) * 60000;
          if (estado.fin) {
            estado.fin += cambio;
          } else {
            const total = despues * 60000;
            const lleno = estado.restante <= 0 || estado.restante >= antes * 60000;
            estado.restante = lleno ? total : Math.max(0, Math.min(total, estado.restante + cambio));
          }
          guardarAjustes(contexto, estado);
          pintar(contexto);
        }

        function abajo(contexto) {
          if (!pulsado.has(contexto)) pulsado.set(contexto, Date.now());
          StreamDeck.setState(contexto, 1);
        }

        function arriba(contexto, mensaje) {
          const estado = estadoDe(contexto);
          const desde = pulsado.get(contexto) || Date.now();
          pulsado.delete(contexto);
          StreamDeck.setState(contexto, 0);
          const largo = Date.now() - desde;
          const ajustes = ajustesDe(mensaje);
          /* Del inspector solo interesan los minutos; si la perilla acaba de
           * cambiarlos, el payload puede venir un paso por detras. */
          estado.ajustes.encadenar = ajustes.encadenar;
          if (largo >= LARGO_MS) reiniciar(contexto);
          else if (estado.fin) pausar(contexto);
          else arrancar(contexto);
        }

        StreamDeck.addEventListener('willAppear', (mensaje) => {
          const ajustes = ajustesDe(mensaje);
          const estado = estadoDe(mensaje.context, ajustes);
          estado.ajustes = ajustes;
          pintar(mensaje.context);
        });

        StreamDeck.addEventListener('didReceiveSettings', (mensaje) => {
          const ajustes = ajustesDe(mensaje);
          const estado = estadoDe(mensaje.context, ajustes);
          estado.ajustes = ajustes;
          pintar(mensaje.context);
        });

        StreamDeck.addEventListener('willDisappear', (mensaje) => {
          botones.delete(mensaje.context);
          pulsado.delete(mensaje.context);
        });

        StreamDeck.addEventListener('keyDown', (mensaje) => {
          abajo(mensaje.context);
        });

        StreamDeck.addEventListener('keyUp', (mensaje) => {
          arriba(mensaje.context, mensaje);
        });

        StreamDeck.addEventListener('dialDown', (mensaje) => {
          abajo(mensaje.context);
        });

        StreamDeck.addEventListener('dialUp', (mensaje) => {
          arriba(mensaje.context, mensaje);
        });

        StreamDeck.addEventListener('dialRotate', (mensaje) => {
          const pasos = Math.trunc(Number(mensaje.payload && mensaje.payload.ticks)) || 0;
          if (!pasos) return;
          ajustarMinutos(mensaje.context, pasos);
        });

        /* Un solo reloj: al acabarse la fase se encadena la siguiente si toca. */
        setInterval(() => {
          for (const contexto of [...botones.keys()]) {
            const estado = botones.get(contexto);
            if (!estado.fin || restante(estado) > 0) {
              if (estado.fin) pintar(contexto);
              continue;
            }
            if (estado.fase !== 'foco' || estado.ajustes.encadenar) {
              cambiarFase(contexto);
              arrancar(contexto);
              continue;
            }
            estado.restante = 0;
            estado.fin = 0;
            pintar(contexto);
          }
        }, 250);
      })();
    </script>
  </body>
</html>
