<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Metronomo</title>
    <style>
      /* Property Inspector del metronomo.
       *
       * Lo abre VirtualDeck (`PropertyInspectorPath` de la accion). Se registra
       * como PI en el mismo puerto del plugin y guarda con `setSettings`, que el
       * anfitrion reenvia al plugin como `didReceiveSettings`.
       *
       * Estetica DOT: fondo OLED, superficie y bordes de la paleta, grilla de
       * 4px y sin nada de blanco puro.
       */
      :root {
        color-scheme: dark;
        --fondo: #070809;
        --superficie: #111315;
        --borde: #26292e;
        --texto: #d7dade;
        --tenue: #8a8f96;
        --acento: #ff3b30;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--fondo);
        color: var(--texto);
        font: 12px/20px ui-monospace, Consolas, monospace;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 2px;
        color: var(--acento);
      }
      label {
        display: block;
        margin: 12px 0 4px;
        color: var(--tenue);
        letter-spacing: 1px;
      }
      input[type='number'],
      select {
        width: 100%;
        height: 32px;
        padding: 0 8px;
        background: var(--superficie);
        color: var(--texto);
        border: 1px solid var(--borde);
        border-radius: 4px;
        font: inherit;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: var(--acento);
      }
      .nota {
        margin-top: 16px;
        color: var(--tenue);
      }
    </style>
  </head>
  <body>
    <h1>METRONOMO</h1>
    <label for="bpm">TEMPO (BPM, 40-240)</label>
    <input id="bpm" type="number" min="40" max="240" step="1" value="120" />
    <label for="compas">COMPAS</label>
    <select id="compas">
      <option value="2">2/4</option>
      <option value="3">3/4</option>
      <option value="4" selected>4/4</option>
      <option value="6">6/8</option>
    </select>
    <p class="nota">Gira la perilla para cambiar el tempo sin abrir este panel.</p>
    <script src="sdk.js"></script>
    <script>
      (function () {
        const bpm = document.getElementById('bpm');
        const compas = document.getElementById('compas');
        const COMPASES = { 2: true, 3: true, 4: true, 6: true };

        function entero(valor, min, max, defecto) {
          const n = Math.round(Number(valor));
          if (!Number.isFinite(n)) return defecto;
          return Math.min(max, Math.max(min, n));
        }

        function guardar() {
          const tempo = entero(bpm.value, 40, 240, 120);
          const tiempos = COMPASES[Number(compas.value)] ? Number(compas.value) : 4;
          bpm.value = tempo;
          compas.value = String(tiempos);
          StreamDeck.setSettings(undefined, { bpm: tempo, compas: tiempos });
        }

        StreamDeck.addEventListener('didReceiveSettings', (mensaje) => {
          const ajustes = (mensaje.payload && mensaje.payload.settings) || {};
          const tempo = entero(ajustes.bpm, 40, 240, 120);
          const tiempos = COMPASES[Number(ajustes.compas)] ? Number(ajustes.compas) : 4;
          bpm.value = tempo;
          compas.value = String(tiempos);
        });

        for (const campo of [bpm, compas]) campo.addEventListener('change', guardar);
        /* El anfitrion responde a este `getSettings` con lo que haya guardado. */
        StreamDeck.getSettings(undefined);
      })();
    </script>
  </body>
</html>
