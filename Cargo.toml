[workspace]
resolver = "2"
members = [
    "crates/vd-core",
    "crates/vd-node",
]

# Metadatos y dependencias compartidas por todo el workspace. Los crates
# individuales las referencian con `foo.workspace = true` para que la version
# se defina en un solo lugar.
[workspace.package]
version = "1.0.0-alpha.1"
edition = "2021"
rust-version = "1.90"
authors = ["Andy Villatoro <noc@metronethn.com>"]
license = "UNLICENSED"
repository = "https://github.com/AndyVillatoro/virtualdeck"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# **No** `panic = "abort"`. Esto se carga dentro de Electron: un panic con
# `abort` se llevaria por delante el proceso entero del usuario, sin ventana y
# sin mensaje. Con `unwind`, napi lo convierte en una excepcion de JavaScript
# que se puede ver y manejar.
panic = "unwind"
