[package]
name = "vd-app"
# Sin esto, `cargo run -p vd-app` falla: el paquete tiene tambien los binarios
# de los spikes y cargo no sabe cual lanzar.
default-run = "vd-app"
description = "Interfaz de VirtualDeck: egui sobre winit, sin WebView."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vd-core = { path = "../vd-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

# winit directo, no eframe: VirtualDeck vive en la bandeja del sistema y
# necesita control del bucle de eventos para integrar `tray-icon` y
# `global-hotkey`. Ver docs/MIGRACION-RUST.md, seccion 2 (Decisiones).
winit = "0.30"
egui = "0.32"
# `clipboard` es imprescindible: sin esa feature, egui ignora Ctrl+V en silencio
# y el usuario no puede pegar en ningún campo. Verificado por el spike de texto.
# `links` abre URLs del sistema; `wayland`/`x11` son de Linux y aquí sobran.
egui-winit = { version = "0.32", default-features = false, features = [
    "clipboard",
    "links",
] }


# --- renderer: wgpu (decidido midiendo, ver docs/MIGRACION-RUST.md) ---
#
# Los dos backends siguen aqui tras features para que la medicion se pueda
# repetir si cambia alguna premisa. Resultado en release, misma escena:
#
#   glow (OpenGL) : 2,56 MB   144 fps
#   wgpu (D3D12)  : 4,77 MB   144 fps
#
# La hipotesis era que wgpu seria demasiado pesado, y resulto falsa: 2,2 MB de
# diferencia sobre un presupuesto de 20 MB se pagan sin problema. Decide la
# robustez: D3D12 tiene respaldo por software (WARP) cuando no hay GPU
# utilizable —sesion remota, maquina virtual, driver roto— y OpenGL en Windows
# no tiene equivalente fiable. El codigo de wgpu ademas es bastante mas simple:
# comparar los dos spikes lo deja claro.
egui-wgpu = { version = "0.32", optional = true }
# La version la manda `egui-wgpu`, no el gusto propio: fijar una mas nueva
# arrastra un `naga` incompatible y el error que aparece es indescifrable.
wgpu = { version = "25", optional = true, default-features = false, features = [
    "dx12",
    "wgsl",
] }
pollster = { version = "0.4", optional = true }

egui_glow = { version = "0.32", optional = true, default-features = false }
glow = { version = "0.16", optional = true }
glutin = { version = "0.32", optional = true, default-features = false, features = [
    "wgl",
] }
glutin-winit = { version = "0.5", optional = true, default-features = false, features = [
    "wgl",
] }
raw-window-handle = { version = "0.6", optional = true }

# El spike de texto necesita pulsar teclas **fisicas** (no inyectar Unicode)
# para reproducir el camino de las teclas muertas del driver de teclado.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Win32_UI_Input_KeyboardAndMouse"]

[features]
# wgpu por defecto: es la decision tomada.
default = ["render-wgpu"]
render-wgpu = ["dep:egui-wgpu", "dep:wgpu", "dep:pollster"]
render-glow = [
    "dep:egui_glow",
    "dep:glow",
    "dep:glutin",
    "dep:glutin-winit",
    "dep:raw-window-handle",
]

[[bin]]
name = "vd-app"
path = "src/main.rs"
required-features = ["render-wgpu"]

[[bin]]
name = "spike_texto"
path = "src/bin/spike_texto.rs"
required-features = ["render-wgpu"]

[[bin]]
name = "spike_render_wgpu"
path = "src/bin/spike_render_wgpu.rs"
required-features = ["render-wgpu"]

[[bin]]
name = "spike_render_glow"
path = "src/bin/spike_render_glow.rs"
required-features = ["render-glow"]
